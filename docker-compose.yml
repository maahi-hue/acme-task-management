version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: task_management_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: task_management
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - task_network

  backend:
    build: ./backend
    container_name: task_management_backend
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: task_management
      DB_PORT: 3306
    ports:
      - "3000:3000"
    depends_on:
      - mysql
    networks:
      - task_network

  frontend:
    build: ./frontend
    container_name: task_management_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - task_network

volumes:
  mysql_data:

networks:
  task_network:
    driver: bridge
